name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, type-check, test, eval/safety/reliability gates
    runs-on: ubuntu-latest
    services:
      # Real Postgres so the RLS + append-only integration tests run for real
      # (SEC-08/09); without it those tests skip. Throwaway DB.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eadip
          POSTGRES_PASSWORD: eadip
          POSTGRES_DB: eadip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eadip"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Real Qdrant so the per-tenant vector-store integration test runs (FR-016).
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Install deps
        run: uv sync --extra dev --extra data
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type-check (mypy)
        run: uv run mypy
      - name: Unit + integration tests
        env:
          EADIP_TEST_POSTGRES_DSN: postgresql://eadip:eadip@localhost:5432/eadip
          EADIP_TEST_QDRANT_URL: http://localhost:6333
        run: uv run pytest -q
      # --- Phase 12 hard gates (PRD §13-14, TAD Ch 12/16) — all BLOCKING -------
      - name: Eval gate (accuracy >=92%, verified coverage >=95%, grounding >=95%)
        run: uv run eadip-eval
      - name: AI-safety gate (zero unapproved actions)
        run: uv run eadip-safety
      - name: Reliability gate (fault injection)
        run: uv run eadip-reliability
      - name: Load smoke gate (CI-sized; full NFR-02 200-user run via `make load`)
        # CI runners are 2-4 vCPU shared boxes — 50 users proves the concurrency
        # machinery + zero-error bar here; the 200-user NFR-02 evidence runs on
        # perf hardware (make load) and is required at release cut.
        run: uv run eadip-load --users 50 --iterations 2 --p95 5.0
      - name: SAST (bandit)
        run: uv run bandit -c pyproject.toml -q -r src
      - name: Dependency audit (pip-audit)
        run: uv run pip-audit --skip-editable

  build:
    name: Build, scan, sign
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t eadip-gateway:${{ github.sha }} .
      - name: Container scan (trivy — blocking on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: eadip-gateway:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Sign image (cosign keyless — active once pushed to the org registry)
        # Signing requires a registry-held digest; enable the push step with the
        # org's registry credentials, then this signs by digest via OIDC.
        if: github.ref == 'refs/heads/main' && vars.REGISTRY != ''
        run: |
          echo "docker push ${{ vars.REGISTRY }}/eadip-gateway:${{ github.sha }}"
          echo "cosign sign --yes ${{ vars.REGISTRY }}/eadip-gateway@<digest>"
      - name: Deploy to staging
        if: github.ref == 'refs/heads/main' && vars.REGISTRY != ''
        run: 'echo "helm upgrade --install eadip ./deploy/helm/eadip -n staging --set image.tag=${{ github.sha }}"'
